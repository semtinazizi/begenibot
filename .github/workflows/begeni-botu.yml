name: 1000kitap Otomatik Begeni Botu

on:
  # Gunde 3 kez calisacak sekilde bolundu (6 saatlik Github limitine takilmamasi icin)
  # Sabah 05:00 Turkiye saati (UTC 02:00) → 2500 begeni
  # Oglen 13:00 Turkiye saati (UTC 10:00) → 2500 begeni
  # Aksam 21:00 Turkiye saati (UTC 18:00) → 2500 begeni
  # Gunluk toplam: 2500 * 3 = 7500 begeni
  schedule:
    - cron: '0 2 * * *'   # 05:00 TR
    - cron: '0 10 * * *'  # 13:00 TR
    - cron: '0 18 * * *'  # 21:00 TR

  workflow_dispatch:
    inputs:
      gunluk_limit:
        description: 'Bu calisma icin begeni limiti (varsayilan: 2500)'
        required: false
        default: '2500'
      tor_kullan:
        description: 'Tor ile IP gizle?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  begeni-botu:
    name: 'Begeni Botu'
    runs-on: ubuntu-latest
    # Github'in tek islem icin maksimum suresi 360 dakikadir (6 saat).
    timeout-minutes: 355

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bagimliliklari yukle
        run: npm install

      - name: Chromium + Tor sistem bagimliliklari
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tor \
            libgbm-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpangocairo-1.0-0 libpango-1.0-0 libcairo2

      - name: Tor'u yapilandir ve baslat
        run: |
          echo "ControlPort 9051"        | sudo tee -a /etc/tor/torrc
          echo "CookieAuthentication 0"  | sudo tee -a /etc/tor/torrc
          sudo service tor restart
          sleep 20
          echo "--- Tor durumu ---"
          sudo service tor status || true

      - name: Botu calistir
        env:
          KITAP_EMAIL:   ${{ secrets.KITAP_EMAIL }}
          KITAP_SIFRE:   ${{ secrets.KITAP_SIFRE }}
          KITAP_COOKIES: ${{ secrets.KITAP_COOKIES }}
          GUNLUK_LIMIT:  ${{ github.event.inputs.gunluk_limit || '3750' }}
          USE_TOR:       ${{ github.event.inputs.tor_kullan || 'true' }}
        run: node bot.js

      - name: Hata ekran goruntusunu yukle (sadece hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hata-ekran-goruntusu
          path: hata-ekran.png
          retention-days: 3
